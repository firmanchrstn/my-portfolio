<!DOCTYPE html>
<html lang="en" class="no-js scroll-smooth" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Firman Christian Purba</title>
    <meta name="description" content="The page you are looking for could not be found.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://firmanchrstn.github.io/my-portfolio/">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="asset/pp.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-section {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem;
            text-align: center;
        }

        .error-status {
            font-size: clamp(6rem, 18vw, 10rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--brand-primary), #88b029);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .error-title {
            font-size: 2rem;
            margin: 1rem 0 0.75rem;
            color: var(--text-heading);
        }

        .error-message {
            color: var(--text-body);
            line-height: 1.7;
            max-width: 520px;
            margin: 0 auto 2.5rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>

    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
            document.documentElement.classList.remove('no-js');
        })();
    </script>
</head>

<body>
    <a href="#main-content" class="skip-to-content">Skip to content</a>

    <main id="main-content" class="main">
        <section class="error-section container" aria-label="Page not found">
            <div>
                <h1 class="error-status">404</h1>
                <h2 class="error-title">Page Not Found</h2>
                <p class="error-message">The page you are looking for doesn't exist or has been moved. Let's get you
                    back on track.</p>
                <div class="error-actions">
                    <a href="index.html" class="btn btn--primary">
                        Back to Home
                    </a>
                    <a href="index.html#work" class="btn btn--outline">
                        View All Work
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/script.js" defer></script>
</body>

</html>
